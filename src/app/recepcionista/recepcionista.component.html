<div class="recepcionista-root">
  <h2>Agenda de Recepción</h2>

  <section class="nuevo-form">
    <h3>Registrar nueva cita</h3>
    <form [formGroup]="citaForm" (ngSubmit)="registrarCita()">
      <label>
        Fecha
        <input type="date" formControlName="fecha" />
      </label>

      <label>
        Hora
        <input type="time" formControlName="hora" />
      </label>

      <label>
        Motivo
        <input type="text" formControlName="motivo" />
      </label>

      <button type="submit">Registrar</button>
    </form>
  </section>

  <section class="lista-citas">
    <h3>Próximas citas</h3>

    <div *ngIf="loading">Cargando citas...</div>
    <p *ngIf="error" class="error">{{ error }}</p>

    <ul *ngIf="!loading">
      <li *ngFor="let c of citas">
        <strong>{{ c.motivo }}</strong>
        <span>{{ c.fecha }} {{ c.hora || '' }}</span>
        <span class="estado">{{ c.estado }}</span>
        <button type="button" (click)="cancelarCita(c.idCita)">Cancelar</button>
      </li>
    </ul>
  </section>
</div>
