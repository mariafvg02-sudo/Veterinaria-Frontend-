<div class="admin-dashboard">
  <aside class="sidebar">
    <div class="sidebar-header"><i class="fa-solid fa-boxes-stacked"></i> <span>Inventarios</span></div>
    <nav class="sidebar-nav">
      <button [class.active]="activeTab === 'productos'" (click)="setActiveTab('productos')">
        <i class="fa-solid fa-list-check"></i> Stock de Productos
      </button>
      <button [class.active]="activeTab === 'pedidos'" (click)="setActiveTab('pedidos')">
        <i class="fa-solid fa-truck-ramp-box"></i> Pedidos
      </button>
    </nav>
    <div class="sidebar-footer">
      <button type="button" routerLink="/home" class="btn-sidebar-action">
        <i class="fa-solid fa-arrow-left"></i> Inicio
      </button>
      <button type="button" (click)="logout()" class="btn-sidebar-action danger">
        <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="main-content">
    <header class="content-header">
      <h1>Gestión de Suministros</h1>
    </header>

    <section *ngIf="activeTab === 'productos'" class="table-container fade-in">
      <div class="table-header"><h2>Catálogo de Existencias</h2></div>

      <div class="table-controls">
        <label for="filter-products" class="sr-only">Filtrar productos</label>
        <input id="filter-products" type="search" placeholder="Buscar producto" (input)="filterText = $any($event.target).value">
      </div>

      <table class="admin-table" role="table" aria-describedby="stock-desc">
        <caption id="stock-desc">Tabla de productos disponibles y su stock</caption>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Stock</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let prod of filteredProducts">
            <td>{{ prod.nombre }}</td>
            <td>{{ prod.categoria }}</td>
            <td>{{ prod.stock }}</td>
            <td>
              <span class="role-badge" [ngClass]="prod.alerta ? 'administrador' : 'veterinario'" aria-live="polite">
                {{ prod.alerta ? 'STOCK BAJO' : 'OK' }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
