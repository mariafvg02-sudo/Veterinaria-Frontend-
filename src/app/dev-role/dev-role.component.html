<div class="dev-role">
  <h2>Dev Role Switch (solo para pruebas)</h2>
  <div class="form-row">
    <label>Nombre:</label>
    <input [(ngModel)]="name" />
  </div>
  <div class="form-row">
    <label>Rol:</label>
    <select [(ngModel)]="role">
      <option value="cliente">cliente</option>
      <option value="recepcionista">recepcionista</option>
      <option value="administrador">administrador</option>
      <option value="veterinario">veterinario</option>
    </select>
  </div>
  <button (click)="applyRole()">Aplicar rol y navegar</button>
</div>
