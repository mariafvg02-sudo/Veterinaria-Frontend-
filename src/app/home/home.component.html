<div class="home-container" [class.no-scroll]="!isDropdownOpen">
  <!-- HEADER -->
  <header class="home-header">
    <div class="logo-group">
      <div class="paw-icons">
        <i class="fa-solid fa-paw paw-dog"></i>
        <i class="fa-solid fa-paw paw-cat"></i>
      </div>
      <h1 class="brand-name">VET<span>APP</span></h1>
    </div>

    <div class="user-section">
      <button class="user-btn" (click)="toggleDropdown()">
        <i class="fa-solid fa-circle-user"></i>
      </button>
      
      <div class="dropdown-menu" [class.show]="isDropdownOpen">
        <a routerLink="/login" (click)="isDropdownOpen = false" class="dropdown-link">
          <i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión
        </a>
        <a routerLink="/register" (click)="isDropdownOpen = false" class="dropdown-link">
          <i class="fa-solid fa-user-plus"></i> Registrarse
        </a>
      </div>
    </div>
  </header>

  <!-- BODY -->
  <main class="home-content">
    <!-- Sección del Carrusel Profesional -->
    <section class="hero-carousel">
      <div class="carousel-wrapper">
        <article *ngFor="let slide of slides; let i = index" 
                 class="carousel-item" 
                 [class.active]="i === currentSlide">
          
          <div class="slide-background" [style.background-image]="'url(' + slide.image + ')'"></div>
          <div class="slide-overlay"></div>

          <div class="slide-info">
            <span class="slide-badge">{{ slide.badge }}</span>
            <h2 class="slide-title">{{ slide.title }}</h2>
            <p class="slide-description">{{ slide.description }}</p>
            <div class="slide-actions">
              <button class="cta-button" routerLink="/servicios">Solicitar Cita</button>
              <button class="cta-button outline" routerLink="/servicios">Nuestros Servicios</button>
            </div>
          </div>
        </article>

        <!-- Controles de navegación -->
        <button class="carousel-control prev" (click)="prevSlide()"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="carousel-control next" (click)="nextSlide()"><i class="fa-solid fa-chevron-right"></i></button>

        <!-- Indicadores (Puntitos) -->
        <div class="carousel-dots">
          <span *ngFor="let slide of slides; let i = index" 
                [class.active]="i === currentSlide"
                (click)="currentSlide = i"></span>
        </div>
      </div>
    </section>
  </main>

</div>
