<div class="veterinario-container">
  <div class="header">
    <h1><i class="fa-solid fa-user-md"></i> Veterinarios</h1>
    <p>Total de veterinarios registrados: {{ veterinarios.length }}</p>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  
  <div *ngIf="cargando" class="loading">
    <p>Cargando veterinarios...</p>
  </div>

  <div *ngIf="!cargando && veterinarios.length === 0" class="no-data">
    <p>No hay veterinarios registrados</p>
  </div>

  <div class="veterinarios-grid">
    <div *ngFor="let vet of veterinarios" class="card-vet">
      <div class="card-header">
        <h3>{{ vet.nombre }}</h3>
        <span class="especialidad">{{ vet.especialidad }}</span>
      </div>
      <div class="card-body">
        <p><strong>Documento:</strong> {{ vet.documentoIdentidad }}</p>
        <p><strong>Correo:</strong> {{ vet.correo }}</p>
        <p><strong>Teléfono:</strong> {{ vet.telefono }}</p>
      </div>
    </div>
  </div>
</div>
